name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast:
    name: "SAST - Semgrep"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Ejecutar Semgrep
        run: semgrep --config p/php --config p/security-audit src/ --json --output semgrep-results.json || true

      - name: Mostrar resultados
        run: semgrep --config p/php --config p/security-audit src/
        continue-on-error: true

  sca:
    name: "SCA - Trivy (dependencias)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Crear composer.json de ejemplo
        run: |
          cat > composer.json << 'EOF'
          {
            "require": {
              "monolog/monolog": "1.18.0",
              "guzzlehttp/guzzle": "6.3.0",
              "symfony/http-kernel": "4.4.0"
            }
          }
          EOF

      - name: Instalar Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Escanear dependencias
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL . || true
