name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  sast:
    name: "SAST - Semgrep"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Ejecutar Semgrep
        run: semgrep --config p/php --config p/security-audit src/ --json --output semgrep-results.json || true

      - name: Mostrar resultados
        run: semgrep --config p/php --config p/security-audit src/
        continue-on-error: true

  sca:
    name: "SCA - Trivy (dependencias)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependencias PHP
        run: |
          sudo apt-get update && sudo apt-get install -y composer
          composer install --no-interaction 2>&1 || true

      - name: Escanear dependencias con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'

  secrets:
    name: "Secretos - Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ""
        continue-on-error: true

  docker:
    name: "Docker - Trivy (imagen)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t dvwa-devsecops:test .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dvwa-devsecops:test'
          severity: 'CRITICAL'
          format: 'table'

  dast:
    name: "DAST - OWASP ZAP"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Construir y levantar aplicación
        run: |
          docker build -t dvwa-devsecops:test .
          docker run -d -p 8080:80 --name dvwa-test dvwa-devsecops:test
          sleep 5
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true

      - name: Escanear con OWASP ZAP
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8080/'
          rules_file_name: ''
          cmd_options: '-a -j'
          allow_issue_writing: false
        continue-on-error: true
